CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG_WQ_STACK_SIZE=2048
CONFIG_MBOX=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
CONFIG_I2S=y
# 24 significant PCM bits in 32-bit I2S slots permit exact 256x ACLK bypass.
CONFIG_I2S_NRFX_ALLOW_MCK_BYPASS=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=8
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=2
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_ASSERT=y
CONFIG_CRC=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_SPEED_OPTIMIZATIONS=y
