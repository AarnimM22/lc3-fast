CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_NRF_THREAD_STACK_SIZE=1024
CONFIG_USBD_MAX_UDC_MSG=32
# Nano libc uses a byte-at-a-time memcpy on this toolchain. USB and the
# message/radio queues benefit from the full library's optimized copy routine.
CONFIG_NEWLIB_LIBC_NANO=n
